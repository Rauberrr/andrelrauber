<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirmar e-mail | Andre Rauber</title>
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f4f1ea">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png?v=20261104d">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png?v=20261104d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Jost:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/css/style.css?v=20261108a">
</head>
<body>
  <main id="principal" class="conteudo acesso-simples">
    <span class="etiqueta">Sua conta</span>
    <h1 class="titulo-m" id="confirmar-titulo">Confirmando seu e-mail...</h1>
    <p id="confirmar-texto" role="status"></p>
    <p><a class="botao" href="minha-conta.html">Ir para minha conta</a></p>
  </main>

  <script src="assets/js/conta-api.js?v=20261107a"></script>
  <script>
    (function () {
      var token = new URLSearchParams(location.search).get('token') || '';
      var titulo = document.getElementById('confirmar-titulo');
      var texto = document.getElementById('confirmar-texto');
      // O código sai do endereço para não ficar no histórico nem ser repassado
      history.replaceState(null, '', location.pathname);
      window.AR_API.post('api/auth.php?acao=confirmar-email', { token: token }).then(function (r) {
        titulo.textContent = r.ok ? 'E-mail confirmado' : 'Não foi possível confirmar';
        texto.textContent = r.ok ? 'Tudo certo. Obrigado!' : (r.erro || 'Tente novamente em instantes.');
      });
    })();
  </script>
</body>
</html>
