<body>
  <header class="topo">
    <div class="conteudo topo-interno">
      <a class="topo-logo" href="index.html" aria-label="Rauber, página inicial">
        <img class="logo-preta" src="assets/img/logo-preta.png?v=20261109c" alt="" width="453" height="91">
      </a>
    </div>
  </header>

  <main id="principal" class="conteudo acesso-simples">
    <span class="etiqueta">Sua conta</span>
    <h1 class="titulo-m">Esqueci minha senha</h1>
    <p class="acesso-texto">Informe seu e-mail. Se ele tiver conta, enviamos um link para você criar uma nova senha.</p>

    <form id="form-esqueci" novalidate>
      <p class="erro acesso-erro" role="alert"></p>
      <div class="campo">
        <label for="email">E-mail</label>
        <div class="campo-entrada"><input id="email" name="email" type="email" autocomplete="email" maxlength="190"></div>
      </div>
      <button class="botao botao-cheio acesso-enviar" type="submit">Enviar link</button>
    </form>

    <p class="acesso-aviso" id="esqueci-feito" role="status" hidden>Pronto. Se este e-mail tiver conta, o link chega em alguns minutos e vale por 1 hora. Confira também a caixa de spam.</p>

    <p class="acesso-rodape"><a href="entrar.html">Voltar para entrar</a></p>
  </main>

  <script src="assets/js/config.js?v=20261111a"></script>
  <script src="assets/js/main.js?v=20261111a"></script>
  <script src="assets/js/conta-api.js?v=20261112a"></script>
