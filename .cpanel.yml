---
# Publica o site a partir de repositories/andrelrauber, no cPanel.
# So copia e substitui: nao apaga api/config.php, api/fotos-pecas nem api/fotos-produtos.
# O .htaccess da raiz fica de fora porque o cPanel pode acrescentar regras nele.
# Pagina nova na raiz precisa entrar na lista abaixo. A pasta apps vai inteira.
deployment:
  tasks:
    - export DEPLOYPATH=../../public_html/
    - /bin/cp 404.html a-marca.html alimentacao.html colecao.html condicoes-de-compra.html confirmar-email.html contato.html criar-conta.html entrar.html esqueci-senha.html guarda-roupa.html guia-de-medidas.html index.html medidas.html minha-conta.html painel.html painel-videos.html pedido-exclusivo.html privacidade.html produto.html redefinir-senha.html $DEPLOYPATH
    - /bin/cp robots.txt sitemap.xml sw.js $DEPLOYPATH
    - /bin/cp -R apps $DEPLOYPATH
    - /bin/cp -R assets $DEPLOYPATH
    - /bin/cp -R api $DEPLOYPATH
